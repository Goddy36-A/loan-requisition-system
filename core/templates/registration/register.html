{% extends "core/base.html" %}{% block title %}Create account{% endblock %}{% block content %}
<div class="auth-wrap"><div class="card"><div class="card-body p-4">
 <div class="text-center mb-4"><h1 class="h3 mb-1">Create your account</h1><p class="text-muted mb-0">It takes a minute. You will add your details next.</p></div>
 <form method="post">{% csrf_token %}
  {% for field in form %}{% include "core/_field.html" %}{% endfor %}
  <button class="btn btn-primary w-100 mt-2">Create account</button>
 </form>
 <p class="text-center text-muted mt-4 mb-0">Already registered? <a href="{% url 'login' %}">Sign in</a></p>
</div></div></div>{% endblock %}

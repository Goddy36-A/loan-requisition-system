{% extends "core/base.html" %}{% block title %}Change password{% endblock %}{% block content %}
<div class="auth-wrap"><div class="card"><div class="card-body p-4">
 <h1 class="h3 mb-3">Change password</h1>
 <form method="post">{% csrf_token %}

  <div class="d-flex gap-2 mt-2"><button class="btn btn-primary">Change password</button><a class="btn btn-outline-secondary" href="{% url 'account' %}">Cancel</a></div>
 </form>
</div></div></div>{% endblock %}
